apiVersion: v1
kind: Pod
metadata:
  labels:
    app: {{ include "archi.fullname" . }}-config-seed
  name:  {{ include "archi.fullname" . }}-config-seed
spec:
  automountServiceAccountToken: false
  containers:
    - args:
        - bash
        - -lc
        - python -m src.cli.tools.config_seed
      env:
        - name: CONFIG_PATH
          value: /rendered-config/config.yaml 
        - name: PGDATABASE
          value: archi-db
        - name: PGHOST
          value: {{ if .Values.hostMode }}"localhost"{{ else }}"{{ include "archi.fullname" . }}-postgres"{{ end }}
        - name: PGPORT
          value: "{{ .Values.postgres.port }}"
        - name: PGUSER
          value: archi
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "archi.fullname" . }}-secrets
              key: PG_PASSWORD
        - name: VERBOSITY
          value: "4"
      image: {{ .Values.chat.image }}
      imagePullPolicy: Always
      name: config-seed-{{ include "archi.fullname" . }}
      volumeMounts:
        - mountPath: /rendered-config
          name: {{ include "archi.fullname" . }}-chat-config
          readOnly: true
  restartPolicy: OnFailure
  initContainers:
    - name: wait-for-db
      image: busybox
      command:
        - sh
        - -c
        - |
          until nc -z {{ include "archi.fullname" . }}-postgres {{ .Values.postgres.port }}; do
            echo "waiting for postgres..."
            sleep 2
          done
  volumes:
    - configMap:
        name: {{ include "archi.fullname" . }}-chat-config
      name: {{ include "archi.fullname" . }}-chat-config
  {{- if .Values.hostMode }}
  hostNetwork: true
  {{- end }}
    