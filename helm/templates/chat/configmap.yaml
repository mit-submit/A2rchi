apiVersion: v1
data:
  config.yaml: |
    name: wisdqm_agent

    global:
      DATA_PATH: "/root/data/"
      ACCOUNTS_PATH: "/root/.accounts/"
      ACCEPTED_FILES:
        - ".pdf"
        - ".md"
        - ".txt"
        - ".docx"
        - ".html"
        - ".htm"
        - ".json"
        - ".yaml"
        - ".yml"
        - ".py"
        - ".js"
        - ".ts"
        - ".jsx"
        - ".tsx"
        - ".java"
        - ".go"
        - ".rs"
        - ".c"
        - ".cpp"
        - ".h"
        - ".sh"
      LOGGING:
        input_output_filename: "chain_input_output.log"

    services:
      benchmarking:
        out_dir: .
        queries_path: queries
        modes:
          - SOURCES
          - RAGAS
        mode_settings:
          sources_settings:
            default_match_field: file_name # metadata field to check for source matching
          ragas_settings: 
            enabled_metrics:
              - answer_relevancy
              - faithfulness
              - context_precision
              - context_recall
            provider: OpenAI # supports OpenAI, Ollama, HuggingFace, and Anthropic
            evaluation_model_settings:
              model_name: gpt-4
              base_url:  # for Ollama support
            embedding_model: OpenAI
            timeout: 180
            batch_size: False


      piazza:
        agent_class: QAPipeline
        provider: 
        model: 
        network_id: 
        update_time: 60
      mattermost:
        update_time: 60
      redmine_mailbox:
        agent_class: CMSCompOpsAgent
        agents_dir: ""
        provider: 
        model: 
        url: 
        project: 
        redmine_update_time: 10
        answer_tag: -- archi -- Resolving email was sent
        imap4_port: 143
        mailbox_update_time: 10
      postgres:
        port: {{ .Values.postgres.port }}
        user: archi
        database: archi-db
        host: {{ include "archi.fullname" . }}-postgres
      chat_app:
        agent_class: WisDQMAgent
        agents_dir: "/root/archi/agents"
        recursion_limit: 50
        default_provider: local
        default_model: gpt-oss:120b
        skills_dir: ""
        tools: {}
        prompts: {}
        providers:
          local:
            enabled: False
            mode: openai_compat
            local_mode: openai_compat
            default_model: gpt-oss:120b
            models:
              - gpt-oss:120b
        trained_on: CMS DQM Shifts documentation # leaving for now for backwards compatibility can remove later
        port: {{ .Values.chat.port }}
        external_port: {{ .Values.chat.externalPort }}
        host: 0.0.0.0
        hostname: {{ include "archi.fullname" . }}-chat
        template_folder: "/root/archi/src/interfaces/chat_app/templates"
        static_folder: "/root/archi/src/interfaces/chat_app/static"
        num_responses_until_feedback: 3
        include_copy_button: False
        flask_debug_mode: True
        auth:
          enabled: False
          sso:
            enabled: False
            server_metadata_url: 
            authorize_url: 
            client_kwargs:
              scope: openid profile email
          basic:
            enabled: False
      data_manager:
        auth:
          enabled: False
        enabled: True
        port: 7871
        external_port: 7871
        host: 0.0.0.0
        hostname: {{ include "archi.fullname" . }}-data-manager
        template_folder: "/root/archi/src/interfaces/chat_app/templates"
        static_folder: "/root/archi/src/interfaces/chat_app/static"
        flask_debug_mode: False
      grader_app:
        provider: 
        model: 
        prompts:
          grading:
            final_grade_prompt: ""
          image_processing:
            image_processing_prompt: ""
        port: 7861
        external_port: 7862
        host: 0.0.0.0
        hostname: localhost
        template_folder: "/root/archi/src/interfaces/grader_app/templates"
        num_problems: 1
        local_rubric_dir: ""
        local_users_csv_dir: ""
        flask_debug_mode: True
      vectorstore:
        # PostgreSQL with pgvector is the storage backend
        backend: postgres
        # Distance metric for similarity search: "cosine", "l2", "inner_product"
        distance_metric: cosine
      grafana:
        port: 3000
        external_port: 3000

    data_manager:
      collection_name: default_collection
      embedding_name: HuggingFaceEmbeddings
      embedding_class_map:
        OpenAIEmbeddings:
          class: OpenAIEmbeddings
          kwargs:
            model: text-embedding-3-small
          similarity_score_reference: 10
        HuggingFaceEmbeddings:
          class: HuggingFaceEmbeddings
          kwargs:
            model_name: sentence-transformers/all-MiniLM-L6-v2
            model_kwargs:
              device: cpu
            encode_kwargs:
              normalize_embeddings: True
          similarity_score_reference: 10
          query_embedding_instructions: null
      chunk_size: 1000
      chunk_overlap: 0
      parallel_workers: 32
      reset_collection: True
      stemming:
        enabled: False
      distance_metric: cosine
      retrievers:
        semantic_retriever:
          num_documents_to_retrieve: 5
        bm25_retriever:
          num_documents_to_retrieve: 5
        hybrid_retriever:
          num_documents_to_retrieve: 5
          bm25_weight: 0.6
          semantic_weight: 0.4
      sources:
        local_files:
          enabled: True
          visible: True
          schedule: ''
          paths:
        links:
          base_source_depth: 1
          max_pages: 
          enabled: True
          visible: True
          schedule: ''
          input_lists:
            - wisdqm/docs.list
          html_scraper:
            reset_data: True
            verify_urls: False
            enable_warnings: False
          selenium_scraper:
            enabled: False
            visible: False
            use_for_scraping: True
            selenium_class: CERNSSOScraper
            selenium_url: http://localhost:4444
            selenium_class_map:
              CERNSSOScraper:
                class: CERNSSOScraper
                kwargs:
                  headless:  True
        ticket:
          enabled: True
          visible: True
        git:
          enabled: True
          visible: True
          schedule: ''
        sso:
          enabled: True
          visible: True
          schedule: ''
        jira:
          enabled: True
          url: 
          visible: True
          schedule: ''
          projects:
          anonymize_data: False
          max_tickets: 10000000000.0
          cutoff_date: 
        redmine:
          enabled: True
          url: 
          projects:
          visible: False
          schedule: ''
          anonymize_data: True
      utils:
        anonymizer:
            nlp_model: en_core_web_sm
            excluded_words:
              - John
              - Jane
              - Doe
            greeting_patterns:
              - ^(hi|hello|hey|greetings|dear)\b
              - ^\w+,\s*
            signoff_patterns:
              - \b(regards|sincerely|best regards|cheers|thank you)\b
              - ^\s*[-~]+\s*$
            email_pattern: '[\w\.-]+@[\w\.-]+\.\w+'
            username_pattern: '\[~[^\]]+\]'

    archi:
      pipelines: ['QAPipeline']
      agent_description: No description provided
      pipeline_map:
        QAPipeline:
          max_tokens: 10000
          prompts:
            required:
              condense_prompt: null
              chat_prompt: null
          models:
            required:
              condense_model: DumbLLM
              chat_model: DumbLLM
        GradingPipeline:
          max_tokens: 10000
          prompts:
            required:
              final_grade_prompt: null
            optional:
              summary_prompt: null
              analysis_prompt: null
          models:
            required:
              final_grade_model: HuggingFaceOpenLLM
            optional:
              summary_model: HuggingFaceOpenLLM
              analysis_model: HuggingFaceOpenLLM
        ImageProcessingPipeline:
          max_tokens: 10000
          prompts:
            required:
              image_processing_prompt: null
          models:
            required:
              image_processing_model: HuggingFaceImageLLM
        CMSCompOpsAgent:
          recursion_limit: 100
          prompts:
            required:
              agent_prompt: null
          models:
            required:
              agent_model: OllamaInterface
        WisDQMAgent:
          recursion_limit: 100
          prompts:
            required:
              agent_prompt: null
          models:
            required:
              agent_model: OllamaInterface

      model_class_map:
        AnthropicLLM:
          class: AnthropicLLM
          kwargs:
            model_name: claude-3-opus-20240229
            temperature: 1
        OpenAILLM:
          class: OpenAILLM
          kwargs:
            model_name: gpt-4o
            temperature: 1
        DumbLLM:
          class: DumbLLM
          kwargs:
            sleep_time_mean: 3
            filler: I am a dummy LLM response.
        LlamaLLM:
          class: LlamaLLM
          kwargs:
            base_model: meta-llama/Llama-2-7b-chat-hf
            peft_model: null
            enable_salesforce_content_safety: False
            quantization: True
            max_new_tokens: 4096
            seed: null
            do_sample: True
            min_length: null
            use_cache: True
            top_p: 0.9
            temperature: 0.6
            top_k: 50
            repetition_penalty: 1.0
            length_penalty: 1
            max_padding_length: null
        HuggingFaceOpenLLM:
          class: HuggingFaceOpenLLM
          kwargs:
            base_model: Qwen/Qwen2.5-7B-Instruct-1M
            peft_model: null
            enable_salesforce_content_safety: False
            quantization: True
            max_new_tokens: 4096
            seed: null
            do_sample: True
            min_length: null
            use_cache: True
            top_p: 0.9
            temperature: 0.6
            top_k: 50
            repetition_penalty: 1.0
            length_penalty: 1
            max_padding_length: null
        HuggingFaceImageLLM:
          class: HuggingFaceImageLLM
          kwargs:
            base_model: Qwen/Qwen2.5-VL-7B-Instruct
            quantization: True
            min_pixels: 175616
            max_pixels: 1003520
            max_new_tokens: 4096
            seed: null
            do_sample: False
            min_length: null
            use_cache: True
            top_k: 50
            repetition_penalty: 1.0
            length_penalty: 1
        VLLM:
          class: VLLM
          kwargs:
            base_model: Qwen/Qwen2.5-7B-Instruct-1M
            seed: null
            enable_salesforce_content_safety: False
            max_new_tokens: 4096
            top_p: 0.95
            temperature: 0.6
            top_k: 50
            repetition_penalty: 1.0
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.7
            trust_remote_code: True
            tokenizer_mode: auto
            max_model_len: 10000
        OllamaInterface:
          class: OllamaInterface
          kwargs:
            base_model: gemma3
            temperature: 1
            max_tokens: 1000
            url: http://localhost:7870
      chain_update_time: 10
      mcp_servers: {}
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  name: {{ include "archi.fullname" . }}-chat-config
