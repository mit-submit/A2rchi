name: archi-vision

services:
  chat_app:
    agent_class: CMSCompOpsAgent
    agents_dir: examples/agents
    default_provider: local
    default_model: "qwen3:32b"
    providers:
      local:
        enabled: true
        base_url: http://localhost:7870
        mode: ollama
        default_model: "qwen3:32b"
        models:
          - "gpt-oss:120b"
          - "qwen3:32b"
    port: 7867
    external_port: 7867
  postgres:
    port: 5435
  data_manager:
    port: 7878
    external_port: 7878
    auth:
      enabled: false

data_manager:
  sources:
    redmine:
      url: https://cleo.mit.edu
      project: emails-to-ticket
      projects:
        - emails-to-ticket
  embedding_name: HuggingFaceEmbeddings
  captioning:
    enabled: true
    provider: local
    model: gemma4:latest
    caption_mode: gated
    min_text_chars: 200
    dpi: 150
