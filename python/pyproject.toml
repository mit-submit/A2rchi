[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archi"
version = "3.0.0a1"
description = "Archi — the HEP distribution of OKG (v3 distribution)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["archi"]
