# Archi W2 — deployment bridge: edge narrowings for the ported
# jira/docs source emissions (acc.w2.sources). Person and
# DocumentChunk resolve from the co-loaded person and extraction
# modules; JiraIssue / DocumentationPage / SoftwareRepository come
# from archi/schemas/sources.yaml and CMSSWRelease from
# archi/schemas/operations_w1.yaml. Copy this file into the
# deployment as <deployment>/schemas/bridges/sources.yaml, alongside
# archi/schemas/sources.yaml -> <deployment>/schemas/sources.yaml
# (the catalog composer only honors narrowings under schemas/bridges/).
classes:
  EdgeNarrowings:
    description: Narrowings for the ported jira/docs source emissions.
    annotations:
      okg_edge_narrowings: 'true'
    attributes:
      jira_issue_assigned_to_person:
        annotations:
          edge_archetype: assigned_to
          src_subtypes: JiraIssue
          dst_subtypes: Person
      jira_issue_reported_by_person:
        annotations:
          edge_archetype: reported_by
          src_subtypes: JiraIssue
          dst_subtypes: Person
      jira_issue_contains_chunk:
        annotations:
          edge_archetype: contains
          src_subtypes: JiraIssue
          dst_subtypes: DocumentChunk
      chunk_references_jira_issue:
        annotations:
          edge_archetype: references
          src_subtypes: DocumentChunk
          dst_subtypes: JiraIssue
      # chunk -> site and chunk -> infrastructure_service narrowings
      # land with the catalogs port (those subtypes are not composed
      # yet); CMSSWRelease already ships in operations_w1.yaml.
      chunk_references_cmssw_release:
        annotations:
          edge_archetype: references
          src_subtypes: DocumentChunk
          dst_subtypes: CMSSWRelease
      repo_contains_documentation_page:
        annotations:
          edge_archetype: contains
          src_subtypes: SoftwareRepository
          dst_subtypes: DocumentationPage
      documentation_page_contains_chunk:
        annotations:
          edge_archetype: contains
          src_subtypes: DocumentationPage
          dst_subtypes: DocumentChunk
      # TWiki sources (archi.sources.twiki): topic-to-topic references
      # (topic_parent / wiki_link / bare_wikiword).
      documentation_page_references_documentation_page:
        annotations:
          edge_archetype: references
          src_subtypes: DocumentationPage
          dst_subtypes: DocumentationPage
