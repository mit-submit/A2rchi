apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: {{ name }}-config-seed
  name:  {{ name }}-config-seed
spec:
  template:
    metadata:
      labels:
        app: {{ name }}-config-seed
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - bash
            - -lc
            - python -m src.cli.tools.config_seed
          env:
            - name: CONFIG_PATH
              value: /rendered-config/config.yaml 
            - name: PGDATABASE
              value: archi-db
            - name: PGHOST
              value: {% raw %}{{ if .Values.hostMode }}{% endraw %}"localhost"{% raw %}{{ else }}{% endraw %}"{{ name }}-postgres"{% raw %}{{ end }}{% endraw %}
            - name: PGPORT
              value: "{{ "{{ .Values.postgres.port }}" }}"
            - name: PGUSER
              value: archi
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ name }}-secrets
                  key: PG_PASSWORD
            - name: VERBOSITY
              value: "{{ verbosity }}"
          image: {{ "{{ .Values.chat.image }}" }}
          imagePullPolicy: Always
          name: config-seed-{{ name }}
          volumeMounts:
            - mountPath: /rendered-config
              name: {{ name }}-chat-config
              readOnly: true
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z {{ name }}-postgres {% raw %}{{ .Values.postgres.port }}{% endraw %}; do
                echo "waiting for postgres..."
                sleep 2
              done
      volumes:
        - configMap:
            name: {{ name }}-chat-config
          name: {{ name }}-chat-config
      {% raw %}{{- if .Values.hostMode }}{% endraw %}
      hostNetwork: true
      {% raw %}{{- end }}{% endraw %}
        