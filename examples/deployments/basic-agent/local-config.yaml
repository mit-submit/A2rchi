# Local configuration for CMS CompOps Agent
# Uses local Ollama server at localhost:11434
#
# Run with:
# export ARCHI_DIR=/tmp/archi-test
# echo "PG_PASSWORD=testpassword123" > /tmp/test-env
# archi create --name cms-agent --config examples/deployments/basic-agent/local-config.yaml --services chatbot --env-file /tmp/test-env 

name: cms_agent_local

services:
  postgres:
    port: 5432
  chat_app:
    agent_class: CMSCompOpsAgent
    agents_dir: examples/agents
    default_provider: openai
    default_model: gpt-5
    providers:
      openai:
        enabled: true
        default_model: "gpt-5"
        models:
          - "gpt-4o"
          - "gpt-5"
          - "gpt-5.4 mini"
    trained_on: "CMS Computing Documentation"
    port: 7868
    external_port: 7868
    auth:
      enabled: true
      sso:
        enabled: true
        server_metadata_url: "https://auth.cern.ch/auth/realms/cern/.well-known/openid-configuration"
        authorize_url: "https://auth.cern.ch/auth/realms/cern/protocol/openid-connect/auth"
        client_kwargs:
          scope: "openid profile email"
  vectorstore:
    backend: postgres # PostgreSQL with pgvector
  data_manager:
    port: 4242
    external_port: 4242

data_manager:
  sources:
    links:
      input_lists:
        - examples/deployments/basic-agent/miscellanea.list
  embedding_name: HuggingFaceEmbeddings
  embedding_class_map:
    HuggingFaceEmbeddings:
      class: HuggingFaceEmbeddings
      kwargs:
        model_name: sentence-transformers/all-MiniLM-L6-v2
        model_kwargs:
          device: cpu
        encode_kwargs:
          normalize_embeddings: true
      similarity_score_reference: 10

