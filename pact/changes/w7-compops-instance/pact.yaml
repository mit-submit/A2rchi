  rationale: >-
    ADR 0001 W7, model corrected 2026-08-21: gitlab.cern.ch/archi/cms-compops
    (branch archi_v3) is THE comp-ops instance repo; it gains a v3 instance
    definition built on the archi distribution, replacing its v2 A2rchi
    configs at cutover. okg-deployments/cms is the frozen prototype/parity
